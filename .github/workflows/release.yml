name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:compiler-boundary
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Create plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          ZIP_NAME="shaderlab-plugin-${VERSION}.zip"
          mkdir -p out
          zip -r "out/${ZIP_NAME}" dist package.json README.md LICENSE-MIT LICENSE-APACHE docs
          echo "Created out/${ZIP_NAME}"
