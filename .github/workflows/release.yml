name: Build

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - Testing
  pull_request:
    branches:
      - master
      - Testing

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:compiler-boundary
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  github-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:compiler-boundary
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Create plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="shaderlab-plugin-${VERSION}.zip"
          mkdir -p out
          zip -r "out/${ZIP_NAME}" dist package.json README.md LICENSE-MIT LICENSE-APACHE docs CHANGELOG.md
          echo "Created out/${ZIP_NAME}"
      - name: Create GitHub release with zip
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
